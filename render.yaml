services:
  - type: web
    name: educareer-platform
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: educareer_db
          property: connectionString
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
